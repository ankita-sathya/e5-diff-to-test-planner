name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Run pytest suite
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing

    - name: Test CLI basic functionality
      run: |
        python -m src.cli analyze \
          --diff data/sample_pr_diff.patch \
          --catalog data/sample_test_catalog.json \
          --defect data/sample_jira_defect.json \
          --output /tmp/test_report.json \
          --mock-embeddings \
          --full-suite-time 28800

    - name: Verify CLI output
      run: |
        if [ ! -f /tmp/test_report.json ]; then
          echo "ERROR: CLI did not generate output"
          exit 1
        fi
        python -c "import json; data = json.load(open('/tmp/test_report.json')); assert 'ranked_tests' in data['test_selection']"
        echo "✓ CLI output verified"

  test-web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'web/package-lock.json'

    - name: Install web dependencies
      run: |
        cd web
        npm ci

    - name: Type check
      run: |
        cd web
        npm run type-check

    - name: Build web app
      run: |
        cd web
        npm run build

  build-pages:
    needs: [test-backend, test-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build web app
      run: |
        cd web
        npm ci
        npm run build

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'web/out'
        name: github-pages-${{ github.run_attempt }}

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        artifact_name: ${{ needs.build-pages.outputs.artifact_name }}
